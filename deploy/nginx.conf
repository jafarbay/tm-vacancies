# nginx site for the vacancies mirror.
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/vacancies
#          ln -sf /etc/nginx/sites-available/vacancies /etc/nginx/sites-enabled/vacancies
#          rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
# When a domain appears: replace "_" in server_name with it and run certbot --nginx -d domain.

# --- http-level (this file is included inside http {}) ---
# per-IP rate limits: pages and API
limit_req_zone $binary_remote_addr zone=vac_pages:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=vac_api:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=vac_conn:10m;
# micro-cache: data changes only every 30 min, so 30 s of caching costs nothing and absorbs bursts
proxy_cache_path /var/cache/nginx/vacancies levels=1:2 keys_zone=vac_cache:10m max_size=200m inactive=10m
                 use_temp_path=off;

upstream vac_app {
    server 127.0.0.1:8010;
    keepalive 16;  # reuse connections to uvicorn
}

server {
    listen 80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;      # the site accepts no uploads
    client_header_timeout 10s;     # slow-client (slowloris) protection
    client_body_timeout 10s;
    send_timeout 15s;
    limit_conn vac_conn 30;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # read-only site
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    location ~ /\. { deny all; }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;

    # static files are served by the app (nginx as www-data cannot read /root) and cached here
    location /static/ {
        proxy_pass http://vac_app;
        proxy_cache vac_cache;
        proxy_cache_valid 200 1d;
        access_log off;
    }

    location /api/ {
        limit_req zone=vac_api burst=10 nodelay;
        proxy_pass http://vac_app;
        proxy_cache vac_cache;
        proxy_cache_valid 200 30s;
    }

    location / {
        limit_req zone=vac_pages burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://vac_app;
        proxy_cache vac_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
    }
}
