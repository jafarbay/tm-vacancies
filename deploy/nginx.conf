# nginx site for the vacancies mirror.
# Install: cp nginx.conf /etc/nginx/sites-available/vacancies
#          ln -sf /etc/nginx/sites-available/vacancies /etc/nginx/sites-enabled/vacancies
#          rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
# When a domain appears: replace "_" in server_name with it and run certbot --nginx -d domain.

server {
    listen 80 default_server;
    server_name _;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    # static files are served by the app itself: nginx (www-data) cannot read /root
    location /static/ {
        proxy_pass http://127.0.0.1:8010;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
